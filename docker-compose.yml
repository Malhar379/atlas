services:
  postgres:
    image: postgres:17
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: atlas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: